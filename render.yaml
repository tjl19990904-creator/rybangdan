# render.yaml — Render.com 部署配置
# 在 Render.com 控制台创建新 Web Service 时，选择 "Deploy from Image"
# 或连接 GitHub 仓库后 Render 会自动读取此文件

services:
  - type: web
    name: rybangdan
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SITE_NAME
        value: Paid Ranking
      - key: CURRENCY
        value: usd
      - key: CURRENCY_SYMBOL
        value: $
      - key: MIN_AMOUNT
        value: "1"
      - key: DEMO_AUTO_PAY
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false  # 在 Render 控制台手动设置
      - key: ADMIN_SECRET
        sync: false  # 固定随机会话密钥，避免改密码时踢掉所有登录
      - key: PUBLIC_BASE_URL
        value: https://rybangdan.com
      - key: JNH_API_KEY
        sync: false  # 嘉年华支付密钥：已落位，待接口规范确认后再接入启用
      - key: JNH_MERCHANT_ID
        sync: false  # 商户号
      - key: JNH_GATE_ID
        sync: false  # 通道编号 gate_id：312 与四个银行 ID 的层级关系待平台确认
      - key: JNH_BANK_CODE
        sync: false  # 银行编码 bankCode（如四家多米尼加银行需要）
      - key: JNH_ENABLED
        value: "false"  # 总开关：IP 报白生效 + 沙箱联调通过后才改为 true
      - key: JNH_API_BASE
        value: https://api.jnhpay.xyz
      - key: JNH_AMOUNT_MODE
        value: major  # major=主单位 / cents=分；单位待沙箱确认
      - key: JNH_CALLBACK_ACTION
        value: "false"  # 回调签名是否含 action=callback，待平台确认
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX
        value: "true"
      - key: AIRWALLEX_SANDBOX
        value: "true"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
