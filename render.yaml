# render.yaml — Render.com 部署配置
# 在 Render.com 控制台创建新 Web Service 时，选择 "Deploy from Image"
# 或连接 GitHub 仓库后 Render 会自动读取此文件

services:
  - type: web
    name: rybangdan
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SITE_NAME
        value: Paid Ranking
      - key: CURRENCY
        value: usd
      - key: CURRENCY_SYMBOL
        value: $
      - key: MIN_AMOUNT
        value: "1"
      - key: DEMO_AUTO_PAY
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false  # 在 Render 控制台手动设置
      - key: ADMIN_SECRET
        sync: false  # 固定随机会话密钥，避免改密码时踢掉所有登录
      - key: PUBLIC_BASE_URL
        value: https://rybangdan.com
      - key: JNH_API_KEY
        sync: false  # 嘉年华支付密钥：已落位，待接口规范确认后再接入启用
      - key: JNH_MERCHANT_ID
        sync: false  # 商户号
      - key: JNH_GATE_ID
        value: "312"  # 多米尼加本地银行转账通道（已实测下单成功）
      - key: JNH_BANK_CODE_FIELD
        value: bankCode  # 文档字段名；商户侧示例写 bank_code，实测两者均被平台接受
      - key: JNH_ENABLED
        value: "false"  # 总开关：沙箱/小额联调通过后才改为 true
      - key: JNH_API_BASE
        value: https://api.jnhpay.xyz
      - key: JNH_CALLBACK_STRICT
        value: "false"  # 默认兼容两种回调签名口径；确认后可为 true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX
        value: "true"
      - key: AIRWALLEX_SANDBOX
        value: "true"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
